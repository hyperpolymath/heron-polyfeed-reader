# SPDX-License-Identifier: MPL-2.0
#
# heron-polyfeed-reader — portable compose stack (Tier B)
#
# This is the runtime-agnostic, OCI compose-spec file. It works unchanged with:
#   podman compose  -f build/container/compose.yaml up -d
#   nerdctl compose -f build/container/compose.yaml up -d
#   docker  compose -f build/container/compose.yaml up -d
#
# It has NO dependency on the stapeln tier. For the sovereign path
# (selur zero-copy IPC, signed .ctp bundles, svalinn trust policy) use
# build/container/stapeln/compose.toml with `selur-compose` instead.
#
# The Justfile picks the right one automatically:
#   just container-up        # selur-compose if installed, else this file
#
# See https://compose-spec.io for the full specification.

services:
  # ──────────────────────────────────────────────────────────────────────
  # Primary application service
  # ──────────────────────────────────────────────────────────────────────
  "heron":
    build:
      context: ../..          # the repository root (relative contexts resolve from this file's directory)
      dockerfile: build/container/Containerfile
    image: "ghcr.io/hyperpolymath/heron:latest"
    # The web UI has no authentication: publish it on the host loopback only (a mapping without a
    # host IP binds 0.0.0.0 on every interface).
    ports:
      - "127.0.0.1:8484:8484"
    environment:
      HERON_CONFIG: "/config/heron.json"
      HERON_DATA: "/data"
    volumes:
      - "heron-data:/data"
      # heron exits with ConfigNotFound without a config. This one binds the UI to 0.0.0.0 INSIDE the
      # container (loopback there is unreachable from the host) and relies on the mapping above.
      - "./heron.json:/config/heron.json:ro"
    restart: unless-stopped
    # No healthcheck: heron has no /health route and the runtime image carries no curl. heron is
    # PID 1 and exits non-zero on a fatal error, which `restart` handles.
    #
    # The rokur/svalinn gateway services below are template extras. The UI refuses a Host header
    # that is not the bound address or a loopback name (DNS-rebinding defence), so a gateway must
    # forward Host as 127.0.0.1:8484, or be removed (`just container-keep oci portable`).

  # ──────────────────────────────────────────────────────────────────────
  # rokur — secrets-management gate (stapeln). Fronts the app and refuses
  # to start the stack unless required secrets are present.  on Wolfi.
  # Remove this service if you do not use secret gating.
  # ──────────────────────────────────────────────────────────────────────
  rokur:
    image: ghcr.io/hyperpolymath/rokur:latest
    environment:
      ROKUR_BACKEND: "http://heron:8484"
      ROKUR_LISTEN: "[::]:8081"
      ROKUR_REQUIRED_SECRETS: ""        # comma-separated env names that MUST be set
      ROKUR_AUDIT_LOG: "/var/log/rokur/audit.jsonl"
      ROKUR_LOG_FORMAT: "json"
    ports:
      - "8081:8081"
    volumes:
      - rokur-audit:/var/log/rokur
    depends_on:
      "heron":
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────────────────────────────
  # svalinn — edge gateway (stapeln). TLS termination, auth, rate limiting.
  # Reads the gatekeeper policy from build/container/stapeln/.gatekeeper.yaml.
  # Remove this service for a bare app with no gateway.
  # ──────────────────────────────────────────────────────────────────────
  svalinn:
    image: ghcr.io/hyperpolymath/svalinn:latest
    ports:
      - "443:443"
      - "80:80"
    environment:
      SVALINN_BACKEND: "http://rokur:8081"
      SVALINN_POLICY_FILE: "/etc/svalinn/gatekeeper.yaml"
      SVALINN_TLS_AUTO: "true"
    volumes:
      - ./stapeln/.gatekeeper.yaml:/etc/svalinn/gatekeeper.yaml:ro
    depends_on:
      - rokur
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  "heron-data":
  rokur-audit:
