#
# The toolchain for heron-polyfeed-reader (idris2, zig). Specs are `latest`; mise.lock
# records the concrete version and per-platform checksum of each, so every
# checkout installs the same bits. Refresh both with: just toolchain-refresh
# Canon: hyperpolymath/standards 3-practice/provisioning (TRUST-DEFAULTS §toolchain).
# Estate policy: no python, deno, node/npm/yarn, make or nix here; the JS runtime is bun.
#
# Idris2 is not a mise tool: it comes from pack (`just setup` says how).
# A repository created from this template gets this file re-minted for its own
# languages by `launch-scaffolder provision-set realign` (the deed's :repo differs).

[settings]
lockfile = true

[tools]
just = "latest"
shellcheck = "latest"
trivy = "latest"          # just deps-audit
zig = "0.17.0"              # heron needs this version EXACTLY (build.zig.zon minimum_zig_version; std.Io/std.http/TLS APIs changed from 0.16). The Containerfile and .github/workflows/zig-ci.yml pin the same release by SHA-256; move all three together.
